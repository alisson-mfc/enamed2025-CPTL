                                        54: "No meu curso de medicina, aprendi a refletir continuamente sobre a minha formação, buscando atualização permanente e compromisso com a qualidade do cuidado em saúde.",
                                        55: "No meu curso de medicina, aprendi a relacionar as atividades práticas de ensino ao contexto de saúde e bem-estar local e regional.",
                                        56: "No meu curso de medicina, aprendi a desenvolver competências práticas relacionadas a ações de atenção à saúde e ao bem-estar social, em uma perspectiva de integralidade, tanto individual quanto coletiva."
                                    };

                                    return (
                                        <tr key={i} style={{ borderBottom: `1px solid ${COLORS.border}`, background: item.gap > 0 ? `${COLORS.good}08` : Math.abs(item.gap) > 1 ? `${COLORS.bad}08` : "transparent" }}>
                                            <td style={{ padding: "6px 8px", color: COLORS.text, maxWidth: 220, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                                                {item.label}
                                                {qId && qMap[qId] && (
                                                    <button title={qMap[qId]} style={{
                                                        marginLeft: 6, background: COLORS.textDim, color: COLORS.bg, border: "none",
                                                        borderRadius: "50%", width: 14, height: 14, fontSize: 9, fontWeight: "bold",
                                                        cursor: "help", display: "inline-flex", justifyContent: "center", alignItems: "center"
                                                    }}>i</button>
                                                )}
                                            </td>
                                            <td style={{ padding: "6px 8px", color: COLORS.tl, fontWeight: 600, textAlign: "right" }}>{item.tl.toFixed(2)}</td>
                                            <td style={{ padding: "6px 8px", color: COLORS.textDim, textAlign: "right" }}>{item.nac.toFixed(2)}</td>
                                            <td style={{ padding: "6px 8px", fontWeight: 700, textAlign: "right", color: item.gap > 0 ? COLORS.good : Math.abs(item.gap) > 1 ? COLORS.bad : "#fb923c" }}>
                                                {item.gap > 0 ? "+" : ""}{item.gap.toFixed(2)}
                                            </td>
                                        </tr>
                                    );
                                })}
                            </tbody>
                        </table>
                    </div>

                    <SectionTitle>Áreas Críticas para Ação Institucional</SectionTitle>
                    <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(280px, 1fr))", gap: 12 }}>
                        {[
                            { title: "Corpo Docente/Preceptores", gap: -2.25, desc: "Gap de −2,25 pontos. É o maior déficit. Estudantes percebem falta de professores e preceptores em número suficiente." },
                            { title: "Simulação e Laboratórios", gap: -1.36, desc: "Simulação de alta fidelidade (−1,36) e laboratórios de habilidades (−1,15) ficam muito abaixo." },
                            { title: "Coordenação e Gestão", gap: -1.11, desc: "Coordenação indisponível (−1,11) e avaliações periódicas (−0,88) indicam fragilidade na gestão pedagógica percebida." },
                            { title: "Avaliação e Feedback", gap: -0.98, desc: "Devolutivas (−0,98), compatibilidade das avaliações (−0,93) e planos de ensino (−0,93) pedem revisão dos processos avaliativos." },
                        ].map((c, i) => (
                            <div key={i} style={{ background: COLORS.card, border: `1px solid ${COLORS.border}`, borderRadius: 10, padding: 14 }}>
                                <div style={{ fontWeight: 700, fontSize: 13, color: COLORS.text, marginBottom: 6 }}>{c.title}</div>
                                <Badge color={COLORS.bad}>Gap: {c.gap.toFixed(2)}</Badge>
                                <div style={{ fontSize: 12, color: COLORS.textDim, marginTop: 8, lineHeight: 1.5 }}>{c.desc}</div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const PercepcaoTab = () => {
            const dificData = [
                { opt: "Fácil", tl: 4.1, nac: 4.7 },
                { opt: "Médio", tl: 65.3, nac: 53.6 },
                { opt: "Difícil", tl: 28.6, nac: 33.4 },
                { opt: "Muito difícil", tl: 2.0, nac: 6.8 },
            ];
            const tempoData = [
                { opt: "3-4 horas", tl: 36.7, nac: 36.9 },
                { opt: "4-5 horas", tl: 61.2, nac: 47.9 },
                { opt: "5h+, não terminou", tl: 2.0, nac: 10.5 },
            ];
            const estudoData = [
                { opt: "Não estudou maioria", tl: 0, nac: 2.3 },
                { opt: "Estudou, não aprendeu", tl: 0, nac: 4.2 },
                { opt: "Estudou maioria, não aprendeu", tl: 12.2, nac: 14.3 },
                { opt: "Estudou e aprendeu muitos", tl: 83.7, nac: 67.1 },
                { opt: "Estudou e aprendeu todos", tl: 4.1, nac: 10.7 },
            ];

            return (
                <div>
                    <SectionTitle>Grau de Dificuldade Percebido</SectionTitle>
                    <ResponsiveContainer width="100%" height={220}>
                        <BarChart data={dificData} barGap={2}>
                            <CartesianGrid strokeDasharray="3 3" stroke={COLORS.border} />
                            <XAxis dataKey="opt" tick={{ fill: COLORS.textDim, fontSize: 11 }} />
                            <YAxis tick={{ fill: COLORS.textDim, fontSize: 11 }} unit="%" />
                            <Tooltip content={<CustomTooltip />} />
                            <Bar dataKey="tl" name="Três Lagoas" fill={COLORS.tl} radius={[4, 4, 0, 0]} />
                            <Bar dataKey="nac" name="Nacional" fill={COLORS.nac} radius={[4, 4, 0, 0]} />
                        </BarChart>
                    </ResponsiveContainer>

                    <SectionTitle>Tempo Gasto na Prova</SectionTitle>
                    <ResponsiveContainer width="100%" height={200}>
                        <BarChart data={tempoData} barGap={2}>
                            <CartesianGrid strokeDasharray="3 3" stroke={COLORS.border} />
                            <XAxis dataKey="opt" tick={{ fill: COLORS.textDim, fontSize: 11 }} />
                            <YAxis tick={{ fill: COLORS.textDim, fontSize: 11 }} unit="%" />
                            <Tooltip content={<CustomTooltip />} />
                            <Bar dataKey="tl" name="Três Lagoas" fill={COLORS.tl} radius={[4, 4, 0, 0]} />
                            <Bar dataKey="nac" name="Nacional" fill={COLORS.nac} radius={[4, 4, 0, 0]} />
                        </BarChart>
                    </ResponsiveContainer>

                    <SectionTitle>Percepção de Estudo dos Conteúdos</SectionTitle>
                    <ResponsiveContainer width="100%" height={340}>
                        <BarChart data={estudoData} barGap={2} margin={{ bottom: 70 }}>
                            <CartesianGrid strokeDasharray="3 3" stroke={COLORS.border} />
                            <XAxis dataKey="opt" tick={{ fill: COLORS.textDim, fontSize: 10 }} interval={0} angle={-25} textAnchor="end" />
                            <YAxis tick={{ fill: COLORS.textDim, fontSize: 11 }} unit="%" />
                            <Tooltip content={<CustomTooltip />} />
                            <Bar dataKey="tl" name="Três Lagoas" fill={COLORS.tl} radius={[4, 4, 0, 0]} />
                            <Bar dataKey="nac" name="Nacional" fill={COLORS.nac} radius={[4, 4, 0, 0]} />
                        </BarChart>
                    </ResponsiveContainer>

                    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginTop: 20 }}>
                        <div style={{ background: COLORS.card, border: `1px solid ${COLORS.border}`, borderRadius: 10, padding: 14 }}>
                            <div style={{ fontSize: 13, fontWeight: 700, color: COLORS.text, marginBottom: 8 }}>Atividades práticas contribuíram?</div>
                            <div style={{ fontSize: 28, fontWeight: 800, color: COLORS.good }}>98%</div>
                            <div style={{ fontSize: 12, color: COLORS.textDim }}>responderam SIM (nacional: ~88%)</div>
                        </div>
                        <div style={{ background: COLORS.card, border: `1px solid ${COLORS.border}`, borderRadius: 10, padding: 14 }}>
                            <div style={{ fontSize: 13, fontWeight: 700, color: COLORS.text, marginBottom: 8 }}>Clareza dos enunciados</div>
                            <div style={{ fontSize: 28, fontWeight: 800, color: COLORS.accent }}>94%</div>
                            <div style={{ fontSize: 12, color: COLORS.textDim }}>avaliaram "todos" ou "a maioria" como claros</div>
                        </div>
                    </div>
                </div>
            );
        };

        // ─── MAIN ────────────────────────────────────────────────────────────────
        const TABS = [
            { id: "overview", label: "Visão Geral" },
            { id: "benchmark", label: "Benchmarking" },
            { id: "items", label: "Análise por Questão" },
            { id: "avaliacao", label: "Avaliação do Curso" },
            { id: "percepcao", label: "Percepção da Prova" },
        ];

        function Dashboard() {
            const [tab, setTab] = useState("overview");
            return (
                <div style={{ background: COLORS.bg, minHeight: "100vh", color: COLORS.text, fontFamily: "'Segoe UI', -apple-system, sans-serif" }}>
                    <div style={{ maxWidth: 900, margin: "0 auto", padding: "24px 16px" }}>
                        {/* Header */}
                        <div style={{ marginBottom: 24 }}>
                            <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 4 }}>
                                <h1 style={{ fontSize: 22, fontWeight: 800, margin: 0, letterSpacing: -0.5 }}>ENAMED 2025 - UFMS Três Lagoas</h1>
                            </div>
                            <div style={{ fontSize: 13, color: COLORS.textDim }}>
                                Análise dos microdados do Exame Nacional de Avaliação da Formação Médica (Enamed)
                            </div>
                            <div style={{ fontSize: 13, color: COLORS.textDim }}>
                                Prof. Álisson Oliveira dos Santos
                            </div>
                        </div>

                        {/* Tabs */}
                        <div style={{ display: "flex", gap: 8, marginBottom: 24, overflowX: "auto", paddingBottom: 4 }}>
                            {TABS.map(t => (
                                <Tab key={t.id} active={tab === t.id} onClick={() => setTab(t.id)}>
                                    {t.icon} {t.label}
                                </Tab>
                            ))}
                        </div>

                        {/* Content */}
                        {tab === "overview" && <OverviewTab />}
                        {tab === "benchmark" && <BenchmarkTab />}
                        {tab === "items" && <ItemTab />}
                        {tab === "avaliacao" && <AvaliacaoTab />}
                        {tab === "percepcao" && <PercepcaoTab />}

                        {/* Footer */}
                        <div style={{ borderTop: `1px solid ${COLORS.border}`, marginTop: 40, paddingTop: 16, fontSize: 11, color: COLORS.textDim, textAlign: "center", lineHeight: 1.6 }}>
                            Fonte: Instituto Nacional de Estudos e Pesquisas Educacionais Anísio Teixeira. Microdados do Enamed 2025. [online]. Brasília: Inep, 2025. [citado 2025-01-16]. <br />
                            Disponível em: https://www.gov.br/inep/pt-br/acesso-a-informacao/dados-abertos/microdados/enamed.
                        </div>
                    </div>
                </div>
            );
        }

        // Initialize React app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Dashboard />);
    </script>
</body>

</html>
