                    <SectionTitle>Radar de competências por área</SectionTitle>
                    <p style={pStyle}>
                        O Gráfico 2 mostra o aproveitamento médio nas áreas essenciais da formação médica (Clínica Médica, Pediatria, Cirurgia Geral, Ginecologia/Obstetrícia e Medicina de Família e Comunidade/Saúde Coletiva).
                        O formato do polígono "envelopando" as demais instituições indica que a média de acertos da UFMS-CPTL foi superior em todas as áreas.
                        Medicina de Família e Comunidade e Cirurgia Geral foram as áreas com melhor desempenho em relação às médias nacional e das federais.
                        Um ponto de atenção é que, embora superior à média, as áreas de Clínica Médica e Ginecologia/Obstetrícia acompanham mais de perto a média nacional e das federais.
                    </p>

                    <SectionTitle>Análise de itens (pedagógico)</SectionTitle>
                    <p style={pStyle}>
                        No Gráfico 3, cada ponto ("bolinha") é uma questão da prova. No eixo X, temos a dificuldade da questão de acordo com a Teoria de Resposta ao Item (TRI). Quanto mais à direita, mais difícil. No eixo Y, temos a porcentagem de acerto da turma.
                        O comportamento ideal é uma curva descendente suave, ou seja, os estudantes acertam muito as fáceis e menos as difíceis.
                    </p>
                    <p style={pStyle}>
                        Em relação aos resultados observados pela UFMS-CPTL, nas questões fáceis (esquerda do gráfico), nossos estudantes tiveram acertos acima de 80%-90%.
                        Os pontos abaixo da curva (questões fáceis e médias que tiveram acerto baixo) são os itens nos quais a turma teve maior dificuldade conceitual.

                    <SectionTitle>Percepção estudantil (Gestão)</SectionTitle>
                    <p style={pStyle}>
                        O Gráfico 4 mostra a concordância dos estudantes com afirmações sobre a qualidade do curso.
                        O desempenho que chama atenção negativamente é em relação ao laboratório de habilidades. Enquanto as federais têm aproximadamente 71% de aprovação, a UFMS-CPTL fica em torno de 64%.
                        Considerando que o nosso laboratório de habilidades é bem estruturado, o desempenho aquém pode se dever ao fato de a turma ter passado boa parte do curso antes da sua estruturação e consolidação. Outra razão pode ser o baixo uso por parte dos docentes.

                                Análise dos microdados do Exame Nacional de Avaliação da Formação Médica (Enamed)
                            </div>
                            <div style={{ fontSize: 13, color: COLORS.textDim }}>
                                Prof. Álisson Oliveira dos Santos
                            </div>
                        </div>

                        {/* Tabs */}
                        <div style={{ display: "flex", gap: 8, marginBottom: 24, overflowX: "auto", paddingBottom: 4 }}>
                            {TABS.map(t => (
                                <Tab key={t.id} active={tab === t.id} onClick={() => setTab(t.id)}>
                                    {t.icon} {t.label}
                                </Tab>
                            ))}
                        </div>

                        {/* Content */}
                        {tab === "overview" && <OverviewTab />}
                        {tab === "benchmark" && <BenchmarkTab />}
                        {tab === "items" && <ItemTab />}
                        {tab === "avaliacao" && <AvaliacaoTab />}
                        {tab === "percepcao" && <PercepcaoTab />}
                        {tab === "resumo" && <ResumoTab />}

                        {/* Footer */}
                        <div style={{ borderTop: `1px solid ${COLORS.border}`, marginTop: 40, paddingTop: 16, fontSize: 11, color: COLORS.textDim, textAlign: "center", lineHeight: 1.6 }}>
                            Fonte: Instituto Nacional de Estudos e Pesquisas Educacionais Anísio Teixeira. Microdados do Enamed 2025. [online]. Brasília: Inep, 2025. [citado 2025-01-16]. <br />
                            Disponível em: https://www.gov.br/inep/pt-br/acesso-a-informacao/dados-abertos/microdados/enamed.
                        </div>
                    </div>
                </div>
            );
        }

        // Initialize React app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Dashboard />);
    </script>
</body>

</html>
